id: pluto_source_bae
label: "Bae: PlutoSDR Source"
category: "[plasma]"

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
  - id: uri
    label: Device URI
    dtype: string
    default: '""'
  - id: frequency
    label: Center Frequency (Hz)
    dtype: int
    default: 2400000000
  - id: samplerate
    label: Sample Rate (Hz)
    dtype: int
    default: 2000000
  - id: bandwidth
    label: RF Bandwidth (Hz)
    dtype: int
    default: 1500000
  - id: rx1_en
    label: Enable RX1
    dtype: bool
    default: true
  - id: rx2_en
    label: Enable RX2
    dtype: bool
    default: false
  - id: buffer_size
    label: Buffer Size
    dtype: int
    default: 4096
  - id: quadrature
    label: Quadrature Tracking
    dtype: bool
    default: true
  - id: rfdc
    label: RF DC Tracking
    dtype: bool
    default: true
  - id: bbdc
    label: BB DC Tracking
    dtype: bool
    default: true
  - id: gain1
    label: RX1 Gain Mode
    dtype: string
    default: '"manual"'
  - id: gain1_value
    label: RX1 Gain Value (dB)
    dtype: float
    default: 10.0
  - id: gain2
    label: RX2 Gain Mode
    dtype: string
    default: '"manual"'
  - id: gain2_value
    label: RX2 Gain Value (dB)
    dtype: float
    default: 10.0
  - id: rf_port_select
    label: RF Port Select
    dtype: string
    default: '"A_BALANCED"'
  - id: filter
    label: FIR Filter File
    dtype: string
    default: '""'
  - id: auto_filter
    label: Auto Filter
    dtype: bool
    default: true
  # Metadata keys
  - id: tx_freq_key
    label: Tx frequency key
    dtype: string
    default: core:tx_freq
    hide: part
    category: Metadata
  - id: rx_freq_key
    label: Rx frequency key
    dtype: string
    default: core:rx_freq
    hide: part
    category: Metadata
  - id: sample_start_key
    label: Sample start key
    dtype: string
    default: core:sample_start
    hide: part
    category: Metadata

inputs:
  - id: in
    domain: message
    optional: true

outputs:
  - id: out
    domain: message
    optional: true

templates:
  imports: from gnuradio import plasma
  make: |-
    plasma.pluto_radar_bae(
      ${uri},
      ${frequency},
      ${samplerate},
      ${bandwidth},
      ${rx1_en},
      ${rx2_en},
      ${buffer_size},
      ${quadrature},
      ${rfdc},
      ${bbdc},
      ${gain1},
      ${gain1_value},
      ${gain2},
      ${gain2_value},
      ${rf_port_select},
      ${filter},
      ${auto_filter})
    self.${id}.set_metadata_keys(${tx_freq_key}, ${rx_freq_key}, ${sample_start_key})
    

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1