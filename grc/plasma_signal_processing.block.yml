id: plasma_signal_processing
label: Signal Processing
category: '[plasma]'

parameters:
- id: fft_size
  label: FFT size
  dtype: int
  default: 1024
  options: [128, 256, 512, 1024, 2048, 4096, 8192, 16384]
  option_labels: [128, 256, 512, 1024, 2048, 4096, 8192, 16384]

- id: backend
  label: Backend
  dtype: enum
  options: [plasma.Device.DEFAULT, plasma.Device.CPU, plasma.Device.CUDA, plasma.Device.OPENCL]
  option_labels: [Default, CPU, Cuda, OpenCL]

- id: samplerate
  label: Sample Rate (Hz)
  dtype: float
  default : "samp_rate"

- id: fft_on
  label: FFT flag
  dtype: bool
  default: True

- id: output_magnitude
  label: Magnitude flag
  dtype: bool
  default: True

- id: window_type
  label: Window
  dtype: int
  options: [0, 1, 2, 3, 4, 5, 6]
  option_labels: ["NONE", "Hanning", "Hamming", "Blackman", "Blackman-Harris", "Flat-Top", "Kaiser"]
  default: 0

# Metadata keys
- id: n_pulse_cpi_key
  label: Pulses per CPI Key
  dtype: string
  default: n_pulse_cpi
  hide: part
  category: Metadata

inputs:
- id: rx
  domain: message

outputs:
- id: out
  domain: message

templates:
  imports: from gnuradio import plasma
  make: |-
    plasma.signal_processing(${fft_size},${samplerate},${fft_on},${output_magnitude},${window_type})
#    self.${id}.set_metadata_keys(${n_pulse_cpi_key})
#    self.${id}.set_msg_queue_depth(${depth})
#    self.${id}.set_backend(${backend})

file_format: 1